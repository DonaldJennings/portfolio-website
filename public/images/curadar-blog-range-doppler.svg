<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />

  <g stroke="#334155" stroke-width="1" opacity="0.35">
    <path d="M0 105 H1200 M0 210 H1200 M0 315 H1200 M0 420 H1200 M0 525 H1200" />
  </g>

  <!-- range-doppler heatmap grid -->
  <g transform="translate(120,150)">
    <g id="grid"></g>
    <!-- 24x10 cells with varying opacity to suggest a doppler map with a bright detection -->
  </g>

  <g transform="translate(120,150)" font-family="ui-monospace, monospace">
    <g>
      <!-- rows -->
      <g fill="#134e4a">
        <rect x="0" y="0" width="960" height="300" opacity="0.5" />
      </g>
      <g stroke="#1e293b" stroke-width="1">
        <line x1="0" y1="0" x2="0" y2="300" />
        <line x1="40" y1="0" x2="40" y2="300" />
        <line x1="80" y1="0" x2="80" y2="300" />
        <line x1="120" y1="0" x2="120" y2="300" />
        <line x1="160" y1="0" x2="160" y2="300" />
        <line x1="200" y1="0" x2="200" y2="300" />
        <line x1="240" y1="0" x2="240" y2="300" />
        <line x1="280" y1="0" x2="280" y2="300" />
        <line x1="320" y1="0" x2="320" y2="300" />
        <line x1="360" y1="0" x2="360" y2="300" />
        <line x1="400" y1="0" x2="400" y2="300" />
        <line x1="440" y1="0" x2="440" y2="300" />
        <line x1="480" y1="0" x2="480" y2="300" />
        <line x1="520" y1="0" x2="520" y2="300" />
        <line x1="560" y1="0" x2="560" y2="300" />
        <line x1="600" y1="0" x2="600" y2="300" />
        <line x1="640" y1="0" x2="640" y2="300" />
        <line x1="680" y1="0" x2="680" y2="300" />
        <line x1="720" y1="0" x2="720" y2="300" />
        <line x1="760" y1="0" x2="760" y2="300" />
        <line x1="800" y1="0" x2="800" y2="300" />
        <line x1="840" y1="0" x2="840" y2="300" />
        <line x1="880" y1="0" x2="880" y2="300" />
        <line x1="920" y1="0" x2="920" y2="300" />
        <line x1="960" y1="0" x2="960" y2="300" />
      </g>
      <!-- bright doppler detection blob -->
      <ellipse cx="560" cy="150" rx="90" ry="55" fill="#4ade80" opacity="0.35" />
      <ellipse cx="560" cy="150" rx="45" ry="26" fill="#86efac" opacity="0.6" />
      <ellipse cx="560" cy="150" rx="16" ry="10" fill="#ecfccb" opacity="0.9" />

      <ellipse cx="260" cy="220" rx="30" ry="18" fill="#22c55e" opacity="0.25" />
    </g>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#5eead4">
    <text x="60" y="80" font-size="22" letter-spacing="3" opacity="0.85">RANGE &#8226; DOPPLER</text>
    <text x="60" y="110" font-size="14" fill="#94a3b8" letter-spacing="2">CUDA-ACCELERATED FFT PROCESSING</text>
  </g>

  <g font-family="ui-monospace, monospace" fill="#64748b" font-size="12">
    <text x="120" y="480">RANGE (SAMPLES) &#8594;</text>
    <text x="60" y="150" transform="rotate(-90 60 150)">DOPPLER (Hz) &#8594;</text>
  </g>
</svg>
