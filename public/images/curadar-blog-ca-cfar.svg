<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />

  <g stroke="#334155" stroke-width="1" opacity="0.35">
    <path d="M0 105 H1200 M0 210 H1200 M0 315 H1200 M0 420 H1200 M0 525 H1200" />
  </g>

  <!-- signal trace with CFAR threshold and a detected peak -->
  <g transform="translate(80,470)">
    <line x1="0" y1="0" x2="1040" y2="0" stroke="#334155" stroke-width="2" />

    <!-- noise floor signal -->
    <path d="M0,-20 L20,-28 L40,-18 L60,-30 L80,-16 L100,-26 L120,-20 L140,-32 L160,-18 L180,-24
             L200,-18 L220,-30 L240,-22 L260,-16 L280,-28 L300,-20 L320,-30 L340,-22 L360,-18
             L380,-26 L400,-20 L420,-30 L440,-22 L460,-260 L480,-160 L500,-40 L520,-24 L540,-30
             L560,-20 L580,-28 L600,-18 L620,-26 L640,-20 L660,-30 L680,-22 L700,-18 L720,-28
             L740,-20 L760,-30 L780,-22 L800,-18 L820,-26 L840,-20 L860,-30 L880,-22 L900,-18
             L920,-28 L940,-20 L960,-30 L980,-22 L1000,-18 L1020,-26 L1040,-20"
          fill="none" stroke="#5eead4" stroke-width="2.5" />

    <!-- CFAR adaptive threshold -->
    <path d="M0,-42 L1040,-42" stroke="#f97316" stroke-width="2" stroke-dasharray="8 6" opacity="0.85" />

    <!-- detection marker -->
    <circle cx="460" cy="-260" r="9" fill="none" stroke="#facc15" stroke-width="3" />
    <line x1="460" y1="-280" x2="460" y2="-320" stroke="#facc15" stroke-width="2" />
  </g>

  <g font-family="ui-monospace, monospace" fill="#facc15" font-size="14">
    <text x="415" y="130">TARGET DETECTED</text>
  </g>

  <g font-family="ui-monospace, monospace" fill="#94a3b8" font-size="13">
    <text x="900" y="460" fill="#f97316">CFAR THRESHOLD</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#5eead4">
    <text x="60" y="80" font-size="22" letter-spacing="3" opacity="0.85">CA-CFAR</text>
    <text x="60" y="110" font-size="14" fill="#94a3b8" letter-spacing="2">CONSTANT FALSE ALARM RATE DETECTION</text>
  </g>
</svg>
