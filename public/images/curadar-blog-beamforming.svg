<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="beamGlow" cx="0%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />

  <g stroke="#334155" stroke-width="1" opacity="0.35">
    <path d="M0 105 H1200 M0 210 H1200 M0 315 H1200 M0 420 H1200 M0 525 H1200" />
  </g>

  <!-- antenna array -->
  <g transform="translate(140,315)">
    <g fill="#5eead4">
      <rect x="-4" y="-70" width="8" height="140" rx="4" transform="translate(0,-90)" />
      <rect x="-4" y="-70" width="8" height="140" rx="4" transform="translate(0,-30)" />
      <rect x="-4" y="-70" width="8" height="140" rx="4" transform="translate(0,30)" />
      <rect x="-4" y="-70" width="8" height="140" rx="4" transform="translate(0,90)" />
    </g>
    <line x1="0" y1="-140" x2="0" y2="140" stroke="#334155" stroke-width="3" />
  </g>

  <!-- main beam and side lobes fanning to the right -->
  <g transform="translate(140,315)" fill="url(#beamGlow)">
    <path d="M0 0 L900 -60 A900 900 0 0 1 900 60 Z" />
  </g>
  <g transform="translate(140,315)" stroke="#4ade80" stroke-width="2" opacity="0.9" fill="none">
    <path d="M0 0 L920 0" />
  </g>
  <g transform="translate(140,315)" stroke="#2dd4bf" stroke-width="1.5" opacity="0.55" fill="none">
    <path d="M0 0 L880 -180" />
    <path d="M0 0 L880 180" />
    <path d="M0 0 L760 -320" />
    <path d="M0 0 L760 320" />
  </g>

  <!-- beam pattern arcs -->
  <g transform="translate(140,315)" fill="none" stroke="#334155" opacity="0.5">
    <circle r="300" />
    <circle r="600" />
    <circle r="900" />
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#5eead4">
    <text x="60" y="80" font-size="22" letter-spacing="3" opacity="0.85">BARTLETT BEAMFORMING</text>
    <text x="60" y="110" font-size="14" fill="#94a3b8" letter-spacing="2">ANGLE-OF-ARRIVAL ESTIMATION</text>
  </g>
</svg>
